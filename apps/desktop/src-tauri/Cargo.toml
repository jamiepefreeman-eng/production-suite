[package]
name = "production-suite"
description = "Presenter + Lighting + Audio + Visualizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "production_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["usb-dmx", "audio", "lyric-follow"]
# Enttec DMX USB Pro / Open DMX over a serial port.
usb-dmx = ["dep:serialport"]
# Audio device discovery (CoreAudio / WASAPI / ASIO via cpal).
audio = ["dep:cpal"]
# Lyric Follow speech-to-text (whisper.cpp, on this computer). Needs CMake + a C++ compiler to build.
lyric-follow = ["audio", "dep:whisper-rs"]

[dependencies]
suite-core = { path = "../../../crates/suite-core", features = ["serde"] }
# protocol-asset: lets slides show image/video files from the media bin.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serialport = { version = "4", optional = true }
cpal = { version = "0.15", optional = true }
socket2 = { version = "0.5", features = ["all"] }
# MIDI controllers for Lighting's show page (CoreMIDI / WinMM / ALSA).
midir = "0.10"
whisper-rs = { version = "0.14", optional = true }

# GPU-accelerated speech-to-text on Macs.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", optional = true, features = ["metal"] }
